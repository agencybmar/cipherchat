services:
  cipherchat:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      TRUST_PROXY: "0"
      TOKEN_PEPPER: "${TOKEN_PEPPER:?Set TOKEN_PEPPER in your environment or .env file}"
      STUN_URLS: "${STUN_URLS:-stun:stun.l.google.com:19302}"
      TURN_URLS: "${TURN_URLS:-}"
      TURN_USERNAME: "${TURN_USERNAME:-}"
      TURN_CREDENTIAL: "${TURN_CREDENTIAL:-}"
    volumes:
      - cipherchat-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  cipherchat-data:
